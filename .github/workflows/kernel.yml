# The kernel has to compile. That is all this checks, and it is deliberate.
#
# Not the image: building it installs a Void sysroot with xbps, which is most
# of a gigabyte over the network from a mirror this repository does not
# control. A build that fails when somebody else's mirror is slow teaches
# people to ignore it.
#
# `make check` rather than `make kernel`, because two of the three
# configurations are compiled only when asked for and rot quietly otherwise --
# see the target in the GNUmakefile.
name: kernel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build every configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gcc and make come with the runner. Pillow does not, and the console
      # font is rendered from a TTF at build time by support/terminal-font.py.
      - name: install what the build needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil

      - name: report the toolchain
        run: |
          cc --version | head -1
          make --version | head -1
          python3 -c 'import PIL; print("Pillow", PIL.__version__)'

      - name: build
        run: make check

      - name: the three kernels exist
        run: ls -l build/check/*/kernel.elf
