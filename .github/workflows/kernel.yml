name: kernel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build every configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: report the toolchain
        run: |
          cc --version | head -1
          make --version | head -1

      - name: build
        run: make check

      - name: the three kernels and their modules exist
        run: ls -l build/check/*/kernel.elf build/check/*/modules/*.ko
