# What "default" means on this machine.
#
# The stock configuration for an HD Audio card (alsa-lib's own
# cards/HDA-Intel.conf) sends the default device through dmix, which mixes
# several programs into one stream in the library rather than in the driver. It
# cannot work here: dmix shares its ring through SysV semaphores, which this
# kernel does not implement, and the software volume control above it asks the
# driver to create a mixer element, which it does not do either. What that
# looks like from a program is not a missing feature; it is snd_pcm_open()
# failing, and the program reporting that it found no sound card.
#
# So default is the card itself, with the plug layer above it to convert rate,
# format and channel count. One program at a time gets the card, which is what
# a machine with no sound server has anyway.
pcm.!default {
	type plug
	slave.pcm "hw:0,0"
}

ctl.!default {
	type hw
	card 0
}
