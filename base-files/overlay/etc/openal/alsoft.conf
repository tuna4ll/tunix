# OpenAL Soft, which is what every game on this image plays through.
#
# The defaults ask for a 33 millisecond buffer: three periods of 512 frames.
# That is a reasonable bargain where the mixing thread can raise its priority,
# which it now can here -- but the buffer still has to be this large, and the
# two were measured separately.
#
# 8192 frames at 48 kHz is 170 milliseconds. Below it the machine cannot keep
# up: 512 frames times 4, which is 43 milliseconds, produced 5086 underruns
# under a software renderer, where 8192 produces none. Something here still
# stops for longer than that at a time, and until it does not, this is what it
# costs to hear a whole sound.
#
# Not larger either: 12 periods against 8 removed two glitches out of eleven
# before priorities existed, and priorities removed all of them. See
# docs/sound.md.
[general]
period_size = 1024
periods = 8

[alsa]
# The card itself: there is no sound server on this image to mix through, and
# dmix cannot work here (see /etc/asound.conf).
device = default
