# OpenAL Soft, which is what every game on this image plays through.
#
# The defaults ask for a 33 millisecond buffer: three periods of 512 frames.
# That is a reasonable bargain on hardware, where the mixing thread runs at a
# raised priority and is woken by the card. Here it is neither. Nothing in this
# kernel implements scheduling priorities, so pthread_setschedparam fails and
# the mixer runs at the same priority as the game drawing a hundred frames a
# second beside it; the wake-up comes from the tick, at four milliseconds'
# resolution. Miss two of those and the buffer is dry.
#
# What that sounds like is nothing at all: the stream underruns, OpenAL reports
# "mmap commit error: Broken pipe" over and over, and the game plays silence.
#
# 8192 frames at 48 kHz is 170 milliseconds, which is far more latency than a
# game wants and enough to survive being descheduled for a whole frame. Lower
# it when the scheduler grows priorities.
[general]
period_size = 1024
periods = 8

[alsa]
# The card itself: there is no sound server on this image to mix through, and
# dmix cannot work here (see /etc/asound.conf).
device = default
