[core]
plugins = alpha animate autostart command cube decoration expo fast-switcher foreign-toplevel grid gtk-shell idle invert move oswitch place resize session-lock shortcuts-inhibit switcher vswitch wayfire-shell window-rules wobbly wrot zoom

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = command -v kgx >/dev/null && exec kgx || exec weston-terminal
binding_logout = <super> KEY_ESC
command_logout = pkill -x wayfire
