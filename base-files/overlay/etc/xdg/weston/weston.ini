[core]

backend=drm
xwayland=true

idle-time=0


[shell]

background-image=/usr/share/weston/wallpapers/tunix.png
background-type=scale-crop

background-color=0x07090d


panel-position=top

clock-format=seconds-24h

animation=zoom
startup-animation=fade

locking=false

binding-modifier=super


cursor-theme=Vanilla-DMZ

cursor-size=28


[terminal]

font=DejaVu Sans Mono
font-size=14

term=xterm-256color


[keyboard]

keymap_rules=evdev
keymap_model=pc105
keymap_layout=us

repeat-rate=35
repeat-delay=300


[libinput]

enable-tap=true

tap-and-drag=true
disable-while-typing=true

accel-profile=adaptive
accel-speed=0.0

natural-scroll=false


[launcher]
icon=/usr/share/weston/terminal.png
displayname=Terminal
path=/usr/bin/weston-terminal


[launcher]
icon=/usr/share/icons/hicolor/32x32/apps/firefox.png
displayname=Firefox
path=/usr/bin/firefox


[launcher]
icon=/usr/share/icons/hicolor/32x32/apps/supertuxkart.png
displayname=SuperTuxKart
path=/usr/bin/supertuxkart
