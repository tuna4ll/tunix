# Weston's configuration. Read from /etc/xdg/weston/weston.ini.

[core]
# The kernel's own DRM device is the only one there is, and there is no
# accelerated driver behind it: the GL renderer runs on llvmpipe, which is
# fast enough for a desktop at this resolution and is what mesa falls back to
# on its own.
backend=drm
idle-time=0

[shell]
# Vanilla-DMZ rather than the built-in fallback. Weston asks its cursor theme
# for the drag-and-drop shapes as it starts and complains about every one it
# cannot find, and nothing on the image installs a theme called "default".
cursor-theme=Vanilla-DMZ
panel-position=top

[terminal]
font=DejaVu Sans Mono
font-size=14

# Both launchers, and the terminal is not optional: weston puts one on the
# panel only while nothing here defines any, so the first [launcher] section
# takes it away.
[launcher]
icon=/usr/share/weston/terminal.png
path=/usr/bin/weston-terminal

# 32x32 and not one of the larger sizes the package also ships: the panel
# draws the file at its own size, so a 128-pixel icon spills over a 32-pixel
# panel and covers the launcher beside it.
[launcher]
icon=/usr/share/icons/hicolor/32x32/apps/supertuxkart.png
path=/usr/bin/supertuxkart
