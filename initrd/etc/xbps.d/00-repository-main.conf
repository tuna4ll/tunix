# Where xbps looks for packages, and what it calls this machine.
#
# This file deliberately carries the name xbps ships in /usr/share/xbps.d, so it
# replaces that one rather than adding to it: the default there points at Void's
# glibc repository, and nothing in it can run here.
#
# architecture: uname(2) reports "x86_64" and cannot report anything else, but a
# musl userland is a different package set to a glibc one and Void names it
# separately. Without this xbps asks for x86_64 packages and would install
# binaries linked against a libc this system does not have.
architecture=x86_64-musl

# Tunix's own repository first. The pool is searched in the order given here and
# the first repository holding a package wins, version numbers notwithstanding --
# so `xbps-install tty-clock` takes the Tunix build even though Void's
# tty-clock-2.3_2 is newer. Built from github.com/tunixos/tunix-ports.
repository=https://tunixos.github.io/tunix-ports/current/x86_64-musl

# Void's musl set second, for everything we do not package ourselves.
repository=https://repo-default.voidlinux.org/current/musl
