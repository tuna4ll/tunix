# Limine reads this from the EFI system partition, on both firmwares.
#
# The timeout is not zero because the other entries have to be reachable: a
# machine that will not finish booting is exactly the machine whose keyboard is
# the only way to tell it something.
timeout: 3
serial: yes
interface_branding: Tunix
# 4 is blue, which in the palette below is #7aa2f7.
interface_branding_colour: 4

# The menu, in the same colours as everything above it. The palette is the one
# kernel/tty/terminal.c draws the text console with and the one weston.ini
# paints the desktop in, so the machine does not change its mind about what it
# looks like between the loader, the console and the session.
#
# The wallpaper is literally the desktop's: image.sh copies it off the sysroot,
# from the same path weston reads it from. Limine decodes PNG itself, and
# stretches it to whatever mode the entry below asks for.
# The mode the menu itself is drawn at, which is not the entry's: an entry's
# resolution is the framebuffer the kernel is handed, and left to itself the
# menu comes up at 1024x768 -- where a 16:9 wallpaper is stretched into 4:3 and
# the mountains come out squashed. Naming the same mode the entries ask for is
# what makes the loader and the session one continuous picture.
interface_resolution: 1280x720
wallpaper: boot():/boot/wallpaper.png
wallpaper_style: stretched
# What the parts of the screen no image covers get, on a machine whose mode the
# wallpaper does not fit. Tokyo Night's background, so the seam does not show.
backdrop: 1a1b26
# TTRRGGBB: TT is transparency, so the menu is a dark panel the wallpaper still
# comes through rather than a box painted over it.
term_background: 401a1b26
term_foreground: c0caf5
term_background_bright: 414868
term_foreground_bright: f4f7ff
# black, red, green, brown, blue, magenta, cyan, gray -- and the bright eight.
term_palette: 15161e;f7768e;9ece6a;e0af68;7aa2f7;bb9af7;7dcfff;c0caf5
term_palette_bright: 414868;ff899d;b9f27c;f4c97a;8db0ff;c7a9ff;9be8ff;f4f7ff
# Enough margin that the wallpaper is a background rather than a border, and a
# gradient wide enough to soften the edge of the panel against it.
term_margin: 64
term_margin_gradient: 20

/Tunix
    protocol: limine
    # The mode the framebuffer comes up in, and so the only mode the machine
    # has: nothing changes it afterwards, so what the loader picks here is what
    # the desktop runs at for the whole boot. 1280x720 is what the run targets
    # ask the emulator for; left to itself the loader picks 1024x768 and the
    # difference shows as a black band where the guest has no pixels. A display
    # that cannot do it gets the nearest mode instead.
    resolution: 1280x720
    path: boot():/boot/kernel.elf
    # By label rather than by /dev/sdaN: the disk this image is written to is
    # not necessarily the first one the kernel finds. mkfs.ext2 -L writes the
    # label; see root_device_index() in main.c.
    cmdline: root=LABEL=tunix-root

/Tunix (one processor)
    protocol: limine
    # The mode the framebuffer comes up in, and so the only mode the machine
    # has: nothing changes it afterwards, so what the loader picks here is what
    # the desktop runs at for the whole boot. 1280x720 is what the run targets
    # ask the emulator for; left to itself the loader picks 1024x768 and the
    # difference shows as a black band where the guest has no pixels. A display
    # that cannot do it gets the nearest mode instead.
    resolution: 1280x720
    path: boot():/boot/kernel.elf
    # Same machine, one processor. If this boots and the entry above does not,
    # what is wrong is the bring-up or something it races with, and nothing
    # below it. See smp_init() in kernel/smp.c.
    cmdline: root=LABEL=tunix-root nosmp

/Tunix (shell)
    protocol: limine
    # The mode the framebuffer comes up in, and so the only mode the machine
    # has: nothing changes it afterwards, so what the loader picks here is what
    # the desktop runs at for the whole boot. 1280x720 is what the run targets
    # ask the emulator for; left to itself the loader picks 1024x768 and the
    # difference shows as a black band where the guest has no pixels. A display
    # that cannot do it gets the nearest mode instead.
    resolution: 1280x720
    path: boot():/boot/kernel.elf
    # A shell instead of init, and a trace of what it does. It separates
    # "userland does not work" from "the boot scripts do not get through": a
    # prompt here means the kernel, the disk, the loader and libc are all fine
    # and the problem is above them. `verbose` prints the first two dozen
    # faults and syscalls, which is the one window the kernel otherwise has no
    # way to show -- see boot_verbose() in arch/x86_64/limine_entry.c.
    cmdline: root=LABEL=tunix-root init=/bin/sh verbose

/Tunix (hardware report)
    protocol: limine
    resolution: 1280x720
    path: boot():/boot/kernel.elf
    # What this machine turned out to be, printed and written to
    # /tunix-hwreport.txt on the root filesystem. For a machine that behaves
    # differently from the emulator this is developed on -- an unsynchronised
    # TSC, a local timer that calibrated wrong, a processor the firmware
    # described that never came up -- it is the one boot that says so. Read the
    # file afterwards by mounting the disk anywhere else.
    cmdline: root=LABEL=tunix-root hwreport
