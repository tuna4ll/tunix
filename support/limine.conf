# Limine reads this from the EFI system partition, on both firmwares.
#
# The timeout is not zero because the second entry has to be reachable: a
# machine that will not finish booting is exactly the machine whose keyboard is
# the only way to tell it something.
timeout: 3
serial: yes
interface_branding: Tunix

/Tunix
    protocol: limine
    path: boot():/boot/kernel.elf
    # By label rather than by /dev/sdaN: the disk this image is written to is
    # not necessarily the first one the kernel finds. mkfs.ext2 -L writes the
    # label; see root_device_index() in main.c.
    cmdline: root=LABEL=tunix-root

/Tunix (one processor)
    protocol: limine
    path: boot():/boot/kernel.elf
    # Same machine, one processor. If this boots and the entry above does not,
    # what is wrong is the bring-up or something it races with, and nothing
    # below it. See smp_init() in kernel/smp.c.
    cmdline: root=LABEL=tunix-root nosmp
