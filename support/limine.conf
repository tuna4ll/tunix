# Limine reads this from the EFI system partition, on both firmwares.
timeout: 0
serial: yes
interface_branding: Tunix

/Tunix
    protocol: limine
    path: boot():/boot/kernel.elf
    # The root filesystem is the second partition of the disk Limine came from.
    # The kernel resolves the name itself; see root_device_index() in main.c.
    cmdline: root=/dev/sda2
